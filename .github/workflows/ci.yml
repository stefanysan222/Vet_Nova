name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder

  # Tests de autenticación y protección de rutas: solo dependen del middleware
  # y de cookies firmadas localmente, no del backend NestJS (que no vive en
  # este repo). Por eso sí pueden ser un gate obligatorio del pipeline.
  e2e-auth:
    name: Playwright e2e (auth — gate obligatorio)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-no-es-el-de-produccion' }}

      - name: Run Playwright e2e (@auth)
        run: npx playwright test --grep "@auth"
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-no-es-el-de-produccion' }}

      - name: Upload Playwright report (auth)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: frontend/playwright-report
          retention-days: 7

  # Auditoría e2e completa: varias rutas dependen de datos reales del backend
  # NestJS (que no vive en este repo), así que se mantiene informativa hasta
  # que haya un backend accesible en el pipeline.
  e2e-full:
    name: Playwright e2e (auditoría completa)
    runs-on: ubuntu-latest
    needs: frontend
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-no-es-el-de-produccion' }}

      - name: Run Playwright e2e (suite completa)
        run: npx playwright test
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-no-es-el-de-produccion' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/audit-report.json
            frontend/playwright-report
          retention-days: 7
