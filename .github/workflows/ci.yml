name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder

  # Tests de autenticación y protección de rutas: solo dependen del middleware
  # y de cookies firmadas localmente, no del backend NestJS (que no vive en
  # este repo). Por eso sí pueden ser un gate obligatorio del pipeline.
  e2e-auth:
    name: Playwright e2e (auth — gate obligatorio)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-no-es-el-de-produccion' }}

      - name: Run Playwright e2e (@auth)
        run: npx playwright test --grep "@auth"
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-no-es-el-de-produccion' }}

      - name: Upload Playwright report (auth)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: frontend/playwright-report
          retention-days: 7

  # Auditoría e2e completa: varias rutas dependen de datos reales del backend
  # NestJS (que no vive en este repo), así que se mantiene informativa hasta
  # que haya un backend accesible en el pipeline.
  e2e-full:
    name: Playwright e2e (auditoría completa)
    runs-on: ubuntu-latest
    needs: frontend
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-no-es-el-de-produccion' }}

      - name: Run Playwright e2e (suite completa)
        run: npx playwright test
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: placeholder
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-no-es-el-de-produccion' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/audit-report.json
            frontend/playwright-report
          retention-days: 7

  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: e2e-auth
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.vetnova.online
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=590317538413-snk0stt6ikta5dqdcm4jnndor178gmnj.apps.googleusercontent.com
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          tags: |
            ghcr.io/stefanysan222/vetnova-frontend:latest
            ghcr.io/stefanysan222/vetnova-frontend:sha-${{ github.sha }}

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /opt/vet-nova
            docker compose pull frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps frontend
            sleep 40
            docker inspect --format='{{.State.Health.Status}}' vet-nova-frontend-1
            docker image prune -f
